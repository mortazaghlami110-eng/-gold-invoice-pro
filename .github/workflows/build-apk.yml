name: Build Gold Invoice Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldInvoiceAndroid.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q GoldInvoiceAndroid.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        run: |
          find extracted -name gradlew -type f
          find extracted -name build.gradle -type f

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name gradlew -type f | head -1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Invoice-Pro-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
