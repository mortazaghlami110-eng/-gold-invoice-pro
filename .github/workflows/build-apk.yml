name: Build Gold Invoice Pro APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldInvoiceAndroid.zip'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Android Project
        run: |
          mkdir -p extracted
          unzip -o GoldInvoiceAndroid.zip -d extracted
      - name: Find and Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name gradlew | head -1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found in ZIP"
            echo "Files found:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Invoice-Pro-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
